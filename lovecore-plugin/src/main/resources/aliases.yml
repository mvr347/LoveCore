# Алиасы команд LoveCore (2026-09-26). Работают для команды ЛЮБОГО плагина экосистемы
# Love*, не только самого LoveCore — LoveCore регистрирует их напрямую в CommandMap сервера.
#
# Управляются двумя равноправными способами - оба ведут в этот же файл и применяются сразу,
# без рестарта сервера:
#   1) /lovealias add|remove|permission|tab ... (см. /lovealias help)
#   2) Ручная правка этого файла + /lovealias reload
#
# Формат одного алиаса:
#   <имя-алиаса>:
#     target: "<целевая команда>"     # обязательно. Можно с переменными: %1%, %2%, ... -
#                                      # позиционные аргументы вызова, %player% - ник
#                                      # вызвавшего (только для игроков). Без переменных -
#                                      # обычный passthrough: все аргументы алиаса дописываются
#                                      # в конец target как есть.
#     permission: "<право>"           # необязательно. Доп. проверка ПЕРЕД диспетчеризацией в
#                                      # target - если не задано (или "none"), алиас открыт
#                                      # всем, кому доступен сам target (Bukkit всё равно
#                                      # проверит его собственное право при выполнении).
#     tab: delegate|players|fixed|none  # необязательно, по умолчанию delegate.
#                                        # delegate - только для target БЕЗ переменных: таб
#                                        # берётся у самой целевой команды.
#                                        # players - подсказывать ники онлайн-игроков.
#                                        # fixed - фиксированный список слов (tab-suggestions).
#                                        # none - без подсказок.
#     tab-suggestions: [...]          # только при tab: fixed.
#
# Несколько алиасов на одну команду - это просто несколько отдельных ключей с одинаковым
# target, например (пример, раскомментировать и поправить под свои команды):
#
# aliases:
#   тег:
#     target: "suffixes"
#   теги:
#     target: "suffixes"
#   клан-принять:
#     target: "clan accept %1%"
#     tab: players

aliases: {}
