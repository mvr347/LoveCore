# Конфигурация LoveCore.
#
# Любую механику здесь можно погасить нулём или пустым списком, не откатывая версию:
# администратор сервера должен уметь выключить новое, а не выбирать между «с багом»
# и «без плагина».

economy:
  # Название валюты для показа игроку.
  currency-name: "монет"

combat:
  # Сколько секунд игрок считается в бою после удара по игроку или от игрока.
  # 0 — собственный учёт PvP отключён: остаются только метки соседей и явные вызовы
  # mark() из плагинов войн и осад.
  duration-seconds: 15

  # Метки сторонних боевых плагинов (DeluxeCombat и подобные). Ядро их уважает и принимает
  # в собственный учёт. Пустой список — читать чужие метки не надо.
  external-metadata-keys:
    - in_combat

stats:
  # Окно склейки изменений метрик, в тиках. За окно прибавки складываются, а точные значения
  # затирают предыдущие — слушатель получает один итог вместо сотни промежуточных.
  # 0 — склейка отключена, каждое изменение уходит слушателям сразу.
  flush-interval-ticks: 20

reputation:
  # Верх шкалы LoveBehavior. Нужен, чтобы перевести его очки в наши 0..100.
  max-points: 7000

  # Ответ про игрока, о котором у LoveBehavior нет данных: он ни разу не заходил или его
  # данные ещё не подгрузились. Значение по умолчанию попадает в ступень NEUTRAL, потому что
  # незнакомец — не изгой: иначе новичок получал бы у скупщика максимальный штраф к цене.
  unknown: 50

  # С какого значения нормализованной репутации начинается ступень.
  # Всё, что ниже bad, — OUTCAST.
  tier-from:
    bad: 15
    neutral: 35
    good: 55
    respected: 80
