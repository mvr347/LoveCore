# Конфигурация LoveCore.
#
# Любую механику здесь можно погасить нулём или пустым списком, не откатывая версию:
# администратор сервера должен уметь выключить новое, а не выбирать между «с багом»
# и «без плагина».

economy:
  # Название валюты для показа игроку.
  currency-name: "монет"

  # Номиналы монет ItemsAdder и сколько единиц валюты (медных) стоит один такой предмет.
  # ID — без namespace или с ним, сравнивается одинаково (например, и "gold_coin", и
  # "currency:gold_coin" совпадут с ItemsAdder-предметом currency:gold_coin).
  # 2026-10-03: пересмотрено под лестницу ценности. Медная — мусор и мелочь, железная — повседневное
  # («из чего строят»), золотая — редкое, алмазная — «очень богат», незеритовая — скрыта (ниже).
  # Живые монеты на руках переоцениваются сразу: значение берётся отсюда, в предметах оно не хранится.
  denominations:
    copper_coin: 1
    iron_coin: 100
    gold_coin: 2000
    diamond_coin: 20000
    netherite_coin: 100000

  # Скрытые номиналы: по-прежнему считаются деньгами, если лежат в инвентаре, но не участвуют в разбиении
  # сумм, сдаче, обмене и показе глифами — то есть нигде не выдаются и не используются в ценах.
  # 2026-10-03: незеритовая монета (абсолютная дороговизна) пока скрыта, потолок цен — алмазные монеты.
  hidden-denominations:
    - netherite_coin

  # Общий индекс цен: множитель всех сумм, которые плагины читают из своих конфигов (цены, награды, стоимость
  # услуг), одной командой /lovecoreadmin economy index <число>. 1.0 — как в конфигах; 1.2 — всё дороже на 20 %
  # (и награды тоже: так меняется «цена валюты», а не соотношение источников и стоков). Суммы, уже лежащие в
  # базах плагинов (лоты, кассы, казна), индексом не пересчитываются.
  price-index: 1.0

  # Версия масштаба экономики. Плагины со своими базами сравнивают её с записанной у себя и один раз
  # пересчитывают хранимые суммы (с копией базы). Менять вручную не нужно.
  scale-version: 2

  # ============================================================================================
  # Единая модель цен (2026-10-03). Цена предмета = стоимость сырья по рецепту × (1 + наценка за крафт),
  # а не вручную в каждом плагине. Поэтому «алмаз = 100» сам даёт алмазный нагрудник ≈ 8 алмазов + наценка,
  # а не «алмаз 100, броня 20 000». Магазины берут цену отсюда и применяют свои коэффициенты.
  # Разбор любой цены: /lovecoreadmin economy price <предмет>, выгрузка: /lovecoreadmin economy dump-prices.
  # ============================================================================================
  price-model:
    enabled: true
    # Общий множитель модели (после расчёта, до округления). Для всех цен сразу лучше price-index выше.
    global-scale: 1.0
    # Границы итоговой цены одного предмета (медные единицы).
    min-price: 1
    max-price: 500000
    # Топливо при плавке: уголь 4 меди горит на 8 предметов, значит ~0,5; округляем до 1.
    smelt-fuel-cost: 1
    # Наценка за крафт, %. Считается от стоимости сырья. Сжатие/распаковка запасов (9 слитков = блок)
    # и камнерез идут без наценки: блок всегда стоит ровно девять слитков.
    craft-markup:
      default: 15
      tools: 15
      armor: 15
      blocks: 5
      food: 10
      redstone: 25
      decor: 20
    # Наценка по конкретным материалам (перекрывает категорию): ТОТЕМ: 30
    item-markup: {}
    # «Красивое» округление итоговой цены: до up-to включительно цена кратна step.
    rounding:
      - { up-to: 20, step: 1 }
      - { up-to: 200, step: 5 }
      - { up-to: 2000, step: 10 }
      - { up-to: 20000, step: 50 }
      - { up-to: 100000000, step: 100 }
    # Ручные цены: перекрывают и якорь, и расчёт. Пример: DIAMOND: 120
    overrides: {}
    # Якоря сырья: цена того, что не крафтится, а добывается/падает. Остальное выводится из них.
    # Лестница: мусор 1–20 медных, «из чего строить» — медные/железные, ценное — железные,
    # редкий лут — золотые, алмазная монета (20 000) = ~200 алмазов, незеритовая скрыта.
    raw-values:
      # Земля, камень, мусор (1–20 медных: то, что копают без усилий)
      DIRT: 1
      COARSE_DIRT: 1
      ROOTED_DIRT: 2
      GRASS_BLOCK: 2
      PODZOL: 2
      MYCELIUM: 3
