combat:
  # Сколько секунд игрок считается в бою после удара по игроку или от игрока.
  # 0 — собственный учёт PvP отключён: остаются только метки соседей и явные вызовы
  # mark() из плагинов войн и осад.
  duration-seconds: 15

  # Метки сторонних боевых плагинов (DeluxeCombat и подобные). Ядро их уважает и принимает
  # в собственный учёт. Пустой список — читать чужие метки не надо.
  external-metadata-keys:
    - in_combat

stats:
  # Окно склейки изменений метрик, в тиках. За окно прибавки складываются, а точные значения
  # затирают предыдущие — слушатель получает один итог вместо сотни промежуточных.
  # 0 — склейка отключена, каждое изменение уходит слушателям сразу.
  flush-interval-ticks: 20

notify:
  # Сообщения длиннее этого числа символов (без учёта форматирования) считаются "не
  # влезающими" в title/actionbar и всегда показываются в чате — независимо от настроек
  # игрока (см. dev.lovelace.lovecore.api.notify.LoveNotify).
  overflow-length: 60

reputation:
  # Верх шкалы LoveBehavior. Нужен, чтобы перевести его очки в наши 0..100.
  max-points: 7000

  # Ответ про игрока, о котором у LoveBehavior нет данных: он ни разу не заходил или его
  # данные ещё не подгрузились. Значение по умолчанию попадает в ступень NEUTRAL, потому что
  # незнакомец — не изгой: иначе новичок получал бы у скупщика максимальный штраф к цене.
  unknown: 50

  # С какого значения нормализованной репутации начинается ступень.
  # Всё, что ниже bad, — OUTCAST.
  tier-from:
    bad: 15
    neutral: 35
    good: 55
    respected: 80

tax:
  # Единый налог на денежные операции (покупки/продажи NPC, трейды игроков, создание клана
  # и т.д. — кроме чёрного/секретного рынка, если он есть у конкретного плагина). Считается по
  # ступени вежливости игрока (0..6, из LoveBehavior) и корректируется ступенью стиля игры.
  enabled: true

  # Базовая ставка (%) по ступени вежливости. Ступень "0" здесь не используется — см.
  # terrible-forced-percent ниже, она фиксирована и стилем игры не корректируется.
  base-percent-by-politeness:
    "0": 75.0
    "1": 45.0
    "2": 35.0
    "3": 25.0
    "4": 18.0
    "5": 12.0
    "6": 5.0

  # Ступень вежливости "0" (Ужасно) всегда даёт это значение налога — без исключений и без
  # поправки на стиль игры.
  terrible-forced-percent: 75.0

  # Итоговая ставка (после поправки на стиль игры) не выходит за эти границы.
  min-percent: 5.0
  max-percent: 75.0

  # На сколько процентных пунктов агрессивный стиль игры (ступень 0) поднимает налог сверх
  # базовой ставки вежливости у нейтрального игрока (ступень стиля игры 3). При нейтральном
  # стиле поправки нет, при добром (ступень 6) ставка линейно опускается до min-percent.
  aggressive-bonus-percent: 12.0

  # Смягчение ставки для прямых сделок между игроками (например, LoveTrades). Не применяется,
  # если вежливость на ступени "Ужасно" — там налог остаётся полным.
  trade-softening-percent: 50.0

  # Ступени вежливости (0..6), при которых игроку целиком запрещено создание клана —
  # не налог, а полный запрет действия.
  clan-creation-blocked-below-politeness: 2

# Интеграция с Discord: единый бот для тикетов, апелляций, жалоб и привязки аккаунтов.
discord:
  enabled: false # Включите (true) после ввода токена и ID гильдии
  bot-token: ""
  guild-id: ""
  appeals-category-id: ""
  support-category-id: ""
  reports-channel-id: ""
  appeals-log-channel-id: ""
