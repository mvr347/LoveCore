name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Разбор ресурсных YAML до сборки: сломанный plugin.yml или config.yml
      # компиляции не мешает, плагин собирается — и не поднимается на сервере.
      - name: Проверить ресурсные YAML
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          bad = False
          for path in glob.glob("**/src/main/resources/**/*.yml", recursive=True):
              try:
                  yaml.safe_load(open(path, encoding="utf-8"))
              except Exception as exc:
                  print(f"{path}: {exc}"); bad = True
          sys.exit(1 if bad else 0)
          PY

      - name: Build with Maven
        run: mvn -B -DskipTests package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: |
            lovecore-plugin/target/*.jar
            lovecore-api/target/*.jar
            !**/original-*.jar
          if-no-files-found: error
